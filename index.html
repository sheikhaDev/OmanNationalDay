<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مغامرة العيد الوطني العُماني</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Tajawal', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0f18;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer {
            position: relative;
            width: 1000px;
            height: 550px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            outline: none;
            border: 4px solid #FFD700;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            color: #FFD700;
            font-size: 44px;
            margin: 0 0 15px 0;
            text-shadow: 3px 3px 0px #D62612;
        }

        p {
            font-size: 22px;
            margin-bottom: 30px;
            color: #ffffff;
            max-width: 650px;
            line-height: 1.6;
        }

        .btn {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #111;
            border: 4px solid #FFF;
            padding: 16px 45px;
            font-size: 26px;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.08);
            background: linear-gradient(135deg, #00E676, #007A3D);
            color: #FFF;
        }

        .quiz-card {
            background: #1e2638;
            border: 4px solid #FFD700;
            border-radius: 25px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.4);
        }

        .quiz-card h2 {
            color: #00FF88;
            margin-top: 0;
            font-size: 28px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .option-btn {
            background: #2a344a;
            color: #fff;
            border: 2px solid #FFD700;
            padding: 16px 24px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 15px;
            cursor: pointer;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover {
            background: #007A3D;
        }

        /* أزرار اللمس للأطفال */
        #touchControls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 5;
            pointer-events: none;
        }

        .touch-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .touch-btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            border: 3px solid #FFF;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            color: white;
            user-select: none;
            touch-action: manipulation;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        .touch-btn:active {
            transform: scale(0.9);
            background: rgba(0, 230, 118, 0.8);
        }
    </style>
</head>
<body>

<div id="gameContainer" tabindex="0">
    <canvas id="gameCanvas" width="1000" height="550"></canvas>

    <!-- واجهة البداية -->
    <div id="startScreen" class="overlay">
        <h1>مغامرة العيد الوطني العُماني 🇴🇲</h1>
        <p>تحرك ببطء واضرب الصناديق الذهبية القريبة لإجابة الأسئلة والوصول للقلعة!</p>
        <button class="btn" id="startBtn">ابدأ اللعب 🚀</button>
    </div>

    <!-- واجهة السؤال -->
    <div id="quizScreen" class="overlay hidden">
        <div class="quiz-card">
            <h2 id="quizQuestion">السؤال هنا؟</h2>
            <div id="quizOptions" class="options-grid"></div>
        </div>
    </div>

    <!-- واجهة الفوز -->
    <div id="winScreen" class="overlay hidden">
        <h1>عاشت عُمان حرة أبية! 🎉</h1>
        <p>ممتاز جداً يا بطل! لقد أجبت على جميع الأسئلة ووصلت لقلعة النصر 🇴🇲✨</p>
        <button class="btn" id="restartBtn">إعادة اللعب 🔄</button>
    </div>

    <!-- التحكم باللمس -->
    <div id="touchControls">
        <div class="touch-group">
            <div class="touch-btn" id="btnLeft">◀</div>
            <div class="touch-btn" id="btnRight">▶</div>
        </div>
        <div class="touch-group">
            <div class="touch-btn" id="btnJump">▲</div>
        </div>
    </div>
</div>

<script>
    const container = document.getElementById('gameContainer');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // تحميل الصور
    const bgImage = new Image();
    bgImage.src = '814.webp';

    const playerImage = new Image();
    playerImage.src = '813.png';

    // محرك الصوت
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx || audioCtx.state !== 'running') return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(550, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'hitBlock') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'correct') {
                [523.25, 659.25, 783.99].forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'sine';
                    o.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
                    g.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.08);
                    g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.08 + 0.18);
                    o.start(audioCtx.currentTime + idx * 0.08);
                    o.stop(audioCtx.currentTime + idx * 0.08 + 0.18);
                });
            } else if (type === 'firework') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        } catch(e) {}
    }

    // الأسئلة
    const questions = [
        {
            q: "ما هو تاريخ العيد الوطني العُماني المجيد؟ 🇴🇲",
            options: ["18 نوفمبر", "23 يوليو", "1 يناير", "18 ديسمبر"],
            answer: 0
        },
        {
            q: "ما هي عاصمة سلطنة عُمان الجميلة؟ 🏰",
            options: ["صلالة", "مسقط", "صحار", "نزوى"],
            answer: 1
        },
        {
            q: "إلى ماذا يرمز الخنجر العُماني في العلم؟ 🗡️",
            options: ["الأصالة والتراث العُماني", "القوة", "الزراعة", "التجارة"],
            answer: 0
        }
    ];

    let gameState = 'START';
    let activeBlock = null;
    let globalFrame = 0;

    const keys = { right: false, left: false, up: false };

    let cameraX = 0;
    const worldWidth = 2800;
    const groundY = 430; // مستوى الأرض ثابت تماماً

    // شخصية بفيزياء ثابتة ومباشرة جداً للأطفال
    const player = {
        x: 100,
        y: groundY - 75,
        width: 55,
        height: 75,
        speed: 5, // حركة ثابتة فورية
        vy: 0,
        gravity: 0.65,
        jumpPower: -12.5,
        grounded: true,
        facing: 'right'
    };

    // أحجار وزينة صخرية بسيطة فقط (بدون حفر)
    const stones = [
        { x: 500, y: groundY - 30, width: 70, height: 30 },
        { x: 1050, y: groundY - 40, width: 90, height: 40 },
        { x: 1650, y: groundY - 35, width: 80, height: 35 }
    ];

    // صناديق الأسئلة متدلية وقريبة جداً لسهولة الضرب (ارتفاع بسيط)
    const blocks = [
        { x: 400, y: groundY - 140, width: 55, height: 55, hit: false, questionIndex: 0, bounceY: 0 },
        { x: 950, y: groundY - 140, width: 55, height: 55, hit: false, questionIndex: 1, bounceY: 0 },
        { x: 1550, y: groundY - 140, width: 55, height: 55, hit: false, questionIndex: 2, bounceY: 0 }
    ];

    // القلعة وسارية العلم
    const finishLine = {
        flagX: 2200,
        flagY: groundY - 260,
        poleHeight: 260,
        flagSlideY: groundY - 260,
        fortX: 2330,
        fortY: groundY - 220,
        fortWidth: 320,
        fortHeight: 220
    };

    let particles = [];
    let fireworks = [];

    function addParticles(x, y, color) {
        for (let i = 0; i < 15; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                color: color,
                size: Math.random() * 5 + 3,
                life: 25
            });
        }
    }

    function createFirework() {
        const x = finishLine.fortX + Math.random() * finishLine.fortWidth;
        const y = finishLine.fortY - Math.random() * 120;
        const colors = ['#D62612', '#007A3D', '#FFD700', '#FFFFFF'];
        for (let i = 0; i < 25; i++) {
            fireworks.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                color: colors[Math.floor(Math.random() * colors.length)],
                size: 4,
                life: 35
            });
        }
        playSound('firework');
    }

    // المفاتيح
    window.addEventListener('keydown', e => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') {
            if (player.grounded && gameState === 'PLAYING') {
                player.vy = player.jumpPower;
                player.grounded = false;
                playSound('jump');
            }
            keys.up = true;
        }
    });

    window.addEventListener('keyup', e => {
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') keys.up = false;
    });

    // أزرار اللمس
    const setupTouchBtn = (id, keyName) => {
        const btn = document.getElementById(id);
        const startAction = (e) => {
            e.preventDefault();
            initAudio();
            if (keyName === 'up' && player.grounded && gameState === 'PLAYING') {
                player.vy = player.jumpPower;
                player.grounded = false;
                playSound('jump');
            }
            keys[keyName] = true;
        };
        const endAction = (e) => {
            e.preventDefault();
            keys[keyName] = false;
        };

        btn.addEventListener('touchstart', startAction);
        btn.addEventListener('touchend', endAction);
        btn.addEventListener('mousedown', startAction);
        btn.addEventListener('mouseup', endAction);
    };

    setupTouchBtn('btnLeft', 'left');
    setupTouchBtn('btnRight', 'right');
    setupTouchBtn('btnJump', 'up');

    document.getElementById('startBtn').onclick = () => {
        initAudio();
        container.focus();
        document.getElementById('startScreen').classList.add('hidden');
        gameState = 'PLAYING';
    };

    document.getElementById('restartBtn').onclick = () => {
        player.x = 100;
        player.y = groundY - player.height;
        player.vy = 0;
        cameraX = 0;
        finishLine.flagSlideY = groundY - 260;
        blocks.forEach(b => b.hit = false);
        fireworks = [];
        particles = [];
        document.getElementById('winScreen').classList.add('hidden');
        container.focus();
        gameState = 'PLAYING';
    };

    function triggerQuiz(block) {
        gameState = 'QUIZ';
        activeBlock = block;
        const qData = questions[block.questionIndex];
        
        document.getElementById('quizQuestion').innerText = qData.q;
        const optionsContainer = document.getElementById('quizOptions');
        optionsContainer.innerHTML = '';

        qData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span>${opt}</span> <span>⭐</span>`;
            btn.onclick = () => answerQuiz(idx);
            optionsContainer.appendChild(btn);
        });

        document.getElementById('quizScreen').classList.remove('hidden');
    }

    function answerQuiz(selectedIndex) {
        const qData = questions[activeBlock.questionIndex];
        if (selectedIndex === qData.answer) {
            playSound('correct');
            activeBlock.hit = true;
            addParticles(activeBlock.x + activeBlock.width / 2, activeBlock.y + activeBlock.height / 2, '#FFD700');
            document.getElementById('quizScreen').classList.add('hidden');
            container.focus();
            gameState = 'PLAYING';
        } else {
            alert('إجابة خاطئة! حاول مرة أخرى يا بطل 👍');
        }
    }

    // التحديث بفيزياء ثابتة
    function update() {
        globalFrame++;

        if (gameState === 'PLAYING') {
            // حركة ثابتة بدون انزلاق
            if (keys.right) {
                player.x += player.speed;
                player.facing = 'right';
            } else if (keys.left) {
                player.x -= player.speed;
                player.facing = 'left';
            }

            // الجاذبية
            player.vy += player.gravity;
            player.y += player.vy;

            if (player.x < 0) player.x = 0;

            // الوقوف المباشر على الأرضية الثابتة
            if (player.y + player.height >= groundY) {
                player.y = groundY - player.height;
                player.vy = 0;
                player.grounded = true;
            }

            // الصعود على الأحجار البسيطة
            stones.forEach(s => {
                if (player.x + player.width > s.x &&
                    player.x < s.x + s.width &&
                    player.y + player.height >= s.y &&
                    player.y + player.height <= s.y + 15 && player.vy >= 0) {
                    player.y = s.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            });

            // ضرب الصناديق بسهولة
            blocks.forEach(b => {
                if (b.bounceY < 0) b.bounceY += 1;

                if (player.x + player.width * 0.7 > b.x &&
                    player.x + player.width * 0.3 < b.x + b.width &&
                    player.y <= b.y + b.height &&
                    player.y >= b.y + b.height - 15) {
                    
                    player.y = b.y + b.height;
                    player.vy = 2;
                    b.bounceY = -8;

                    if (!b.hit) {
                        playSound('hitBlock');
                        triggerQuiz(b);
                    }
                }
            });

            // خط النهاية
            if (player.x + player.width >= finishLine.flagX) {
                gameState = 'VICTORY_SEQUENCE';
                player.x = finishLine.flagX - player.width / 2;
            }

            // متابعة الكاميرا
            cameraX = player.x - canvas.width / 3;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > worldWidth - canvas.width) cameraX = worldWidth - canvas.width;
        } 
        else if (gameState === 'VICTORY_SEQUENCE') {
            if (finishLine.flagSlideY < groundY - 60) {
                finishLine.flagSlideY += 3;
                player.y = finishLine.flagSlideY;
            } else {
                player.x += 3;
                player.facing = 'right';
                if (player.x >= finishLine.fortX + 100) {
                    gameState = 'WIN';
                    document.getElementById('winScreen').classList.remove('hidden');
                }
            }
        }

        // الجسيمات
        particles.forEach((p, idx) => {
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            if (p.life <= 0) particles.splice(idx, 1);
        });

        if (gameState === 'WIN' || gameState === 'VICTORY_SEQUENCE') {
            if (Math.random() < 0.1) createFirework();
            fireworks.forEach((f, idx) => {
                f.x += f.vx;
                f.y += f.vy;
                f.life--;
                if (f.life <= 0) fireworks.splice(idx, 1);
            });
        }
    }

    // الرسم
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // الخلفية
        if (bgImage.complete && bgImage.naturalWidth !== 0) {
            let bgX = -(cameraX * 0.3) % canvas.width;
            ctx.drawImage(bgImage, bgX, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImage, bgX + canvas.width, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        ctx.save();
        ctx.translate(-Math.floor(cameraX), 0);

        // 1. أرضية مستمرة مئة بالمئة (بدون حفر)
        ctx.fillStyle = '#00E676';
        ctx.fillRect(0, groundY, worldWidth, 20); // عشب أخضر
        ctx.fillStyle = '#5D4037';
        ctx.fillRect(0, groundY + 20, worldWidth, canvas.height - groundY - 20); // تربة

        // 2. الأحجار
        stones.forEach(s => {
            ctx.fillStyle = '#8D6E63';
            ctx.beginPath();
            ctx.roundRect(s.x, s.y, s.width, s.height, 10);
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#3E2723';
            ctx.stroke();
        });

        // 3. صناديق الأسئلة الكبيرة والسهلة
        blocks.forEach(b => {
            let drawY = b.y + b.bounceY;

            if (!b.hit) {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.roundRect(b.x, drawY, b.width, b.height, 10);
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#FFA500';
                ctx.stroke();

                ctx.fillStyle = '#D62612';
                ctx.font = '900 32px Tajawal';
                ctx.textAlign = 'center';
                ctx.fillText('؟', b.x + b.width / 2, drawY + 38);
            } else {
                ctx.fillStyle = '#90A4AE';
                ctx.beginPath();
                ctx.roundRect(b.x, drawY, b.width, b.height, 10);
                ctx.fill();

                ctx.fillStyle = '#FFF';
                ctx.font = '900 28px Tajawal';
                ctx.textAlign = 'center';
                ctx.fillText('✓', b.x + b.width / 2, drawY + 36);
            }
        });

        // 4. القلعة
        ctx.fillStyle = '#D7CCC8';
        ctx.fillRect(finishLine.fortX, finishLine.fortY, finishLine.fortWidth, finishLine.fortHeight);
        ctx.fillRect(finishLine.fortX - 30, finishLine.fortY - 40, 70, finishLine.fortHeight + 40);
        ctx.fillRect(finishLine.fortX + finishLine.fortWidth - 40, finishLine.fortY - 40, 70, finishLine.fortHeight + 40);

        // بوابة القلعة
        ctx.fillStyle = '#3E2723';
        ctx.beginPath();
        ctx.arc(finishLine.fortX + finishLine.fortWidth / 2, finishLine.fortY + finishLine.fortHeight, 40, Math.PI, 0, false);
        ctx.fill();

        // 5. سارية العلم
        ctx.fillStyle = '#FFF';
        ctx.fillRect(finishLine.flagX, finishLine.flagY, 8, finishLine.poleHeight);

        let flagY = finishLine.flagSlideY;
        ctx.fillStyle = '#D62612';
        ctx.fillRect(finishLine.flagX + 8, flagY, 55, 33);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(finishLine.flagX + 8, flagY, 55, 11);
        ctx.fillStyle = '#007A3D';
        ctx.fillRect(finishLine.flagX + 8, flagY + 22, 55, 11);

        // 6. الجسيمات والألعاب النارية
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });

        // 7. الشخصية
        ctx.save();
        ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
        if (player.facing === 'left') ctx.scale(-1, 1);

        if (playerImage.complete && playerImage.naturalWidth !== 0) {
            ctx.drawImage(playerImage, -player.width / 2, -player.height / 2, player.width, player.height);
        } else {
            ctx.fillStyle = '#D62612';
            ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
        }
        ctx.restore();

        fireworks.forEach(f => {
            ctx.fillStyle = f.color;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.restore();
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
