<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مغامرات في بلادي 🇴🇲</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body { font-family: 'Cairo', Tahoma, sans-serif; background-color: #111; color: #fff; overflow: hidden; touch-action: none; direction: rtl; width: 100vw; height: 100vh; }
        
        #game-container { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #000; 
            overflow: hidden;
        }

        canvas { 
            background-color: #87CEEB; 
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8); 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            display: block;
        }
        
        #hud { 
            position: absolute; 
            top: 15px; 
            left: 20px; 
            right: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            pointer-events: none; 
            z-index: 10; 
        }
        .hud-card { 
            background: rgba(20, 20, 20, 0.85); 
            color: #fff; 
            padding: 5px 15px; 
            border-radius: 12px; 
            font-size: clamp(14px, 4vw, 22px); 
            font-weight: 900; 
            border: 3px solid #f1c40f; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            text-shadow: 2px 2px 0px #000; 
        }
        .hud-card span:last-child { color: #f1c40f; }

        #touch-controls { 
            position: absolute; 
            bottom: 20px; 
            left: 20px; 
            right: 20px; 
            display: flex; 
            justify-content: space-between; 
            z-index: 10; 
            pointer-events: none; 
        }
        .control-group { display: flex; gap: 15px; pointer-events: auto; }
        .btn-touch { 
            width: clamp(65px, 15vw, 85px); 
            height: clamp(65px, 15vw, 85px); 
            background: rgba(255, 255, 255, 0.9); 
            border: 4px solid #007a3d; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: clamp(25px, 6vw, 35px); 
            color: #007a3d; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
            font-weight: 900; 
        }
        .btn-touch:active, .btn-touch.pressed { background: #007a3d; color: #fff; transform: scale(0.95); }
        .btn-jump { 
            border-color: #d62828; 
            color: #d62828; 
            width: clamp(75px, 18vw, 95px); 
            height: clamp(75px, 18vw, 95px); 
        }
        .btn-jump:active, .btn-jump.pressed { background: #d62828; color: #fff; }

        .modal { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            width: 90%; 
            max-width: 480px; 
            background: #1a1a1a; 
            border: 4px solid #f1c40f; 
            border-radius: 20px; 
            padding: 20px; 
            text-align: center; 
            color: #fff; 
            z-index: 20; 
            display: none; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        .modal h2 { color: #f1c40f; margin-bottom: 12px; font-size: clamp(18px, 5vw, 24px); font-weight: 900; text-shadow: 2px 2px 0px #d62828; }
        .question-text { font-size: clamp(16px, 4vw, 20px); margin-bottom: 15px; font-weight: 900; color: #fff; line-height: 1.4; text-shadow: 1px 1px 2px #000; }
        .btn-option { background: #2c3e50; border: 3px solid #007a3d; color: #fff; padding: 10px; border-radius: 12px; font-size: clamp(14px, 4vw, 18px); font-weight: 900; width: 100%; margin-bottom: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0px #004d26; }
        .btn-option:hover { background: #007a3d; transform: translateY(-2px); }
        .btn-option:active { transform: translateY(2px); box-shadow: none; }

        #win-screen { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            width: 90%; 
            max-width: 460px; 
            background: #1a1a1a; 
            border: 5px solid #f1c40f; 
            border-radius: 25px; 
            padding: 20px; 
            text-align: center; 
            color: #fff; 
            z-index: 30; 
            display: none; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.9); 
        }
        .win-details { background: #262626; border: 2px dashed #f1c40f; padding: 12px; border-radius: 15px; margin: 12px 0; font-size: clamp(14px, 3.5vw, 18px); color: #fff; text-align: right; display: flex; flex-direction: column; gap: 8px; font-weight: 900; }
        .btn-restart { margin-top: 5px; background: #d62828; color: white; border: 3px solid #fff; padding: 10px 30px; font-size: clamp(16px, 4vw, 20px); font-weight: 900; border-radius: 30px; cursor: pointer; box-shadow: 0 5px 0px #801515; transition: 0.1s; }
        .btn-restart:hover { background: #b01e1e; transform: translateY(-2px); }
        .btn-restart:active { transform: translateY(3px); box-shadow: none; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <div id="hud">
        <div class="hud-card"><span>🇴🇲 الأعلام:</span><span id="score-val">0</span></div>
        <div class="hud-card"><span>⭐ الأسئلة:</span><span id="quest-val">0 / 5</span></div>
    </div>

    <div id="touch-controls">
        <div class="control-group">
            <div class="btn-touch" id="btn-left" style="transform: scaleX(-1);">➔</div>
            <div class="btn-touch" id="btn-right">➔</div>
        </div>
        <div class="control-group">
            <div class="btn-touch btn-jump" id="btn-jump">⬆</div>
        </div>
    </div>

    <div class="modal" id="question-modal">
        <h2>سؤال 🇴🇲</h2>
        <div class="question-text" id="modal-question"></div>
        <div id="modal-options"></div>
        <div id="feedback-msg" style="margin-top:8px; font-weight:900; font-size: 16px;"></div>
    </div>

    <div id="win-screen">
        <h1 style="color:#f1c40f; font-size: clamp(20px, 5vw, 26px); font-weight:900; text-shadow: 2px 2px #d62828;">🎉 أحسنت بطل عُمان! 🇴🇲</h1>
        <p style="font-size:clamp(14px, 3.5vw, 16px); margin: 6px 0; font-weight:700;">أكملت مغامرة العيد الوطني بنجاح!</p>
        
        <div class="win-details">
            <div>✅ <strong>الأسئلة الصحيحة:</strong> <span id="final-questions" style="color:#f1c40f;">0</span> من 5</div>
            <div>🇴🇲 <strong>الأعلام المجمعة:</strong> <span id="final-flags" style="color:#f1c40f;">0</span> من 10</div>
            <div style="color:#2ecc71; font-weight:900; border-top: 1px dashed #555; padding-top: 6px; margin-top: 2px;">⭐ <strong>المجموع الكلي:</strong> <span id="final-score">0</span> نقطة</div>
        </div>

        <button class="btn-restart" onclick="restartGame()">🔄 العب مرة أخرى</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSound(type) {
        try {
            initAudio();
            if (!audioCtx) return;
            let now = audioCtx.currentTime;

            if (type === 'jump') {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'flag') {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(880, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'firework') {
                let bufferSize = audioCtx.sampleRate * 0.4;
                let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                let noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                let filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(350, now);
                filter.frequency.exponentialRampToValueAtTime(40, now + 0.4);

                let gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start(now);
                noise.stop(now + 0.4);
            } else if (type === 'mario-win') {
                let notes = [
                    { freq: 659.25, time: 0.0, dur: 0.15 },
                    { freq: 659.25, time: 0.15, dur: 0.15 },
                    { freq: 659.25, time: 0.35, dur: 0.15 },
                    { freq: 523.25, time: 0.55, dur: 0.15 },
                    { freq: 659.25, time: 0.75, dur: 0.15 },
                    { freq: 783.99, time: 0.95, dur: 0.3 },
                    { freq: 392.00, time: 1.35, dur: 0.3 }
                ];
                notes.forEach(n => {
                    let o = audioCtx.createOscillator();
                    let g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'square';
                    o.frequency.setValueAtTime(n.freq, now + n.time);
                    g.gain.setValueAtTime(0.15, now + n.time);
                    g.gain.linearRampToValueAtTime(0.01, now + n.time + n.dur);
                    o.start(now + n.time);
                    o.stop(now + n.time + n.dur);
                });
            }
        } catch(e) {}
    }

    let charImg = new Image();
    charImg.src = '813.png';
    let charLoaded = false;
    charImg.onload = () => { charLoaded = true; };

    let bgImg = new Image();
    bgImg.src = '814.webp';
    let bgLoaded = false;
    bgImg.onload = () => { bgLoaded = true; };

    const allQuestions = [
        { q: "ما عاصمة سلطنة عُمان؟", options: ["صلالة", "مسقط", "صحار", "نزوى"], answer: 1 },
        { q: "متى تحتفل سلطنة عُمان باليوم الوطني؟", options: ["18 نوفمبر", "20 نوفمبر", "23 يوليو", "11 يناير"], answer: 1 },
        { q: "ما العملة الرسمية في سلطنة عُمان؟", options: ["الدرهم", "الدينار", "الريال العُماني", "الريال السعودي"], answer: 2 },
        { q: "ما ألوان علم سلطنة عُمان؟", options: ["الأحمر والأبيض والأخضر", "الأزرق والأبيض", "الأصفر والأخضر", "الأسود والأحمر"], answer: 0 },
        { q: "في أي محافظة تقع مدينة صلالة؟", options: ["مسقط", "ظفار", "الداخلية", "شمال الباطنة"], answer: 1 },
        { q: "ما أعلى جبل في سلطنة عُمان؟", options: ["جبل شمس", "جبل سمحان", "جبل حفيت", "جبل الأخضر"], answer: 0 },
        { q: "ما الحيوان الذي يُعد من الرموز الوطنية في سلطنة عُمان؟", options: ["المها العربي", "الفيل", "النمر", "الغزال الهندي"], answer: 0 }
    ];

    let activeQuestions = [];
    function selectRandomQuestions() {
        let shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
        activeQuestions = shuffled.slice(0, 5);
    }
    selectRandomQuestions();

    let cameraX = 0, score = 0, answeredCount = 0, collectedFlagsCount = 0, isPaused = false, gameFinished = false;

    const player = { x: 100, y: 260, width: 95, height: 115, vx: 0, vy: 0, speed: 5, jumpPower: -13, gravity: 0.6, grounded: false, facingRight: true, hidden: false };

    const platforms = [
        { x: 0, y: 420, w: 3200, h: 80 },
        { x: 300, y: 320, w: 140, h: 20 },
        { x: 550, y: 260, w: 140, h: 20 },
        { x: 900, y: 310, w: 150, h: 20 },
        { x: 1200, y: 250, w: 160, h: 20 },
        { x: 1550, y: 320, w: 140, h: 20 },
        { x: 1850, y: 270, w: 150, h: 20 },
        { x: 2200, y: 320, w: 160, h: 20 }
    ];

    const stones = [
        { x: 450, y: 380, w: 40, h: 40 },
        { x: 800, y: 375, w: 45, h: 45 },
        { x: 1350, y: 380, w: 40, h: 40 },
        { x: 1750, y: 370, w: 50, h: 50 },
        { x: 2350, y: 380, w: 40, h: 40 }
    ];

    let flagsList = [
        { x: 340, y: 270, collected: false }, { x: 400, y: 370, collected: false },
        { x: 600, y: 210, collected: false }, { x: 750, y: 370, collected: false },
        { x: 950, y: 260, collected: false }, { x: 1250, y: 200, collected: false },
        { x: 1400, y: 370, collected: false }, { x: 1600, y: 270, collected: false },
        { x: 1900, y: 220, collected: false }, { x: 2250, y: 270, collected: false }
    ];

    let questionTriggers = [
        { x: 500, y: 370, qIndex: 0, active: true },
        { x: 1050, y: 250, qIndex: 1, active: true },
        { x: 1450, y: 370, qIndex: 2, active: true },
        { x: 1900, y: 200, qIndex: 3, active: true },
        { x: 2500, y: 370, qIndex: 4, active: true }
    ];

    const castle = { x: 2720, y: 80, w: 380, h: 340, doorX: 2890 };
    let fireworks = [];

    const keys = { left: false, right: false };

    window.addEventListener('keydown', (e) => {
        initAudio();
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
        if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') jump();
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    function bindButton(id, actionPress, actionRelease) {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('pointerdown', (e) => { e.preventDefault(); initAudio(); el.classList.add('pressed'); actionPress(); });
        el.addEventListener('pointerup', (e) => { e.preventDefault(); el.classList.remove('pressed'); actionRelease(); });
        el.addEventListener('pointerleave', (e) => { e.preventDefault(); el.classList.remove('pressed'); actionRelease(); });
    }

    bindButton('btn-left', () => { keys.left = true; }, () => { keys.left = false; });
    bindButton('btn-right', () => { keys.right = true; }, () => { keys.right = false; });
    bindButton('btn-jump', () => { jump(); }, () => {});

    function jump() {
        if (player.grounded && !isPaused && !gameFinished) {
            player.vy = player.jumpPower;
            player.grounded = false;
            playSound('jump');
        }
    }

    function openQuestionModal(qIndex) {
        isPaused = true;
        player.vx = 0;
        keys.left = false; keys.right = false;
        const qData = activeQuestions[qIndex];
        document.getElementById('modal-question').innerText = qData.q;
        const optionsDiv = document.getElementById('modal-options');
        optionsDiv.innerHTML = '';
        document.getElementById('feedback-msg').innerText = '';

        qData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => {
                if (idx === qData.answer) {
                    playSound('flag');
                    document.getElementById('feedback-msg').style.color = '#2ecc71';
                    document.getElementById('feedback-msg').innerText = '🎉 أحسنت! إجابة صحيحة!';
                    score += 5; answeredCount++;
                    document.getElementById('score-val').innerText = score;
                    document.getElementById('quest-val').innerText = `${answeredCount} / 5`;
                    setTimeout(() => {
                        document.getElementById('question-modal').style.display = 'none';
                        isPaused = false;
                    }, 1000);
                } else {
                    document.getElementById('feedback-msg').style.color = '#e74c3c';
                    document.getElementById('feedback-msg').innerText = '😊 حاول مرة أخرى!';
                }
            };
            optionsDiv.appendChild(btn);
        });
        document.getElementById('question-modal').style.display = 'block';
    }

    function update() {
        if (isPaused) return;
        if (!gameFinished) {
            if (keys.left) { player.vx = -player.speed; player.facingRight = false; }
            else if (keys.right) { player.vx = player.speed; player.facingRight = true; }
            else { player.vx = 0; }
        } else { player.vx = 0; }

        player.vy += player.gravity;
        player.x += player.vx;
        player.y += player.vy;
        if (player.x < 10) player.x = 10;

        player.grounded = false;
        
        platforms.forEach(plat => {
            if (player.x < plat.x + plat.w && player.x + player.width > plat.x &&
                player.y + player.height >= plat.y && player.y + player.height <= plat.y + plat.h + player.vy) {
                if (player.vy >= 0) { player.grounded = true; player.vy = 0; player.y = plat.y - player.height; }
            }
        });

        stones.forEach(stone => {
            if (player.x < stone.x + stone.w && player.x + player.width > stone.x &&
                player.y + player.height >= stone.y && player.y + player.height <= stone.y + stone.h + player.vy) {
                if (player.vy >= 0) {
                    player.grounded = true;
                    player.vy = 0;
                    player.y = stone.y - player.height;
                }
            }
            if (player.y + player.height > stone.y && player.y < stone.y + stone.h) {
                if (player.facingRight && player.x + player.width >= stone.x && player.x < stone.x) {
                    player.x = stone.x - player.width;
                } else if (!player.facingRight && player.x <= stone.x + stone.w && player.x + player.width > stone.x + stone.w) {
                    player.x = stone.x + stone.w;
                }
            }
        });

        if (player.y > canvas.height + 50) { player.x = Math.max(100, player.x - 200); player.y = 200; player.vy = 0; }

        if (!gameFinished) {
            flagsList.forEach(flag => {
                if (!flag.collected && player.x < flag.x + 35 && player.x + player.width > flag.x &&
                    player.y < flag.y + 35 && player.y + player.height > flag.y) {
                    flag.collected = true; score += 1; collectedFlagsCount++;
                    document.getElementById('score-val').innerText = score;
                    playSound('flag');
                }
            });

            questionTriggers.forEach(q => {
                if (q.active && player.x < q.x + 35 && player.x + player.width > q.x &&
                    player.y < q.y + 40 && player.y + player.height > q.y) {
                    q.active = false;
                    openQuestionModal(q.qIndex);
                }
            });
        }

        cameraX = player.x - canvas.width / 3;
        if (cameraX < 0) cameraX = 0;

        if (!gameFinished && player.x >= castle.doorX) {
            gameFinished = true; player.hidden = true;
            playSound('mario-win');
            
            for (let i = 0; i < 7; i++) {
                setTimeout(() => {
                    playSound('firework');
                    for (let f = 0; f < 35; f++) {
                        fireworks.push({ x: castle.x + 190 + (Math.random()*120 - 60), y: castle.y + 70 + (Math.random()*100 - 50), vx: (Math.random()-0.5)*9, vy: (Math.random()-0.5)*9, color: ['#d62828','#007a3d','#f1c40f','#fff','#3498db'][Math.floor(Math.random()*5)], alpha: 1 });
                    }
                }, i * 450);
            }
            setTimeout(() => {
                document.getElementById('final-questions').innerText = answeredCount;
                document.getElementById('final-flags').innerText = collectedFlagsCount;
                document.getElementById('final-score').innerText = score;
                document.getElementById('win-screen').style.display = 'block';
            }, 3200);
        }

        if (gameFinished) {
            fireworks.forEach(p => { p.x += p.vx; p.y += p.vy; p.alpha -= 0.02; });
            fireworks = fireworks.filter(p => p.alpha > 0);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (bgLoaded) {
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        ctx.save();
        ctx.translate(-cameraX, 0);

        platforms.forEach(p => {
            ctx.fillStyle = '#6e4726';
            ctx.fillRect(p.x, p.y + 6, p.w, p.h - 6);
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(p.x, p.y, p.w, 8);
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(p.x, p.y, p.w, 3);
            ctx.fillStyle = '#53351b';
            for (let i = 15; i < p.w; i += 40) {
                ctx.fillRect(p.x + i, p.y + 10, 12, p.h - 12);
            }
        });

        stones.forEach(stone => {
            ctx.save();
            ctx.fillStyle = '#7f8c8d';
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(stone.x, stone.y, stone.w, stone.h, [6, 6, 6, 6]);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#95a5a6';
            ctx.fillRect(stone.x + 6, stone.y + 6, stone.w - 12, stone.h - 12);
            ctx.fillStyle = '#34495e';
            ctx.fillRect(stone.x + 10, stone.y + 10, stone.w - 20, 4);
            ctx.fillRect(stone.x + 10, stone.y + stone.h - 14, stone.w - 20, 4);
            ctx.restore();
        });

        flagsList.forEach(f => {
            if (!f.collected) {
                ctx.save();
                ctx.font = '36px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🇴🇲', f.x + 15, f.y + 15);
                ctx.restore();
            }
        });

        questionTriggers.forEach(q => {
            if (q.active) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(q.x + 18, q.y + 18, 20, 0, Math.PI * 2);
                ctx.fillStyle = '#f1c40f';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#d62828';
                ctx.stroke();
                
                ctx.font = '22px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⭐', q.x + 18, q.y + 18);
                ctx.restore();
            }
        });

        ctx.save();
        ctx.fillStyle = '#8c6239';
        ctx.fillRect(castle.x, castle.y + 70, castle.w, castle.h - 70);

        ctx.fillStyle = '#6d4c2b';
        ctx.beginPath();
        ctx.arc(castle.x + 50, castle.y + 70, 55, Math.PI, 0, false);
        ctx.fill();
        ctx.fillRect(castle.x - 5, castle.y + 70, 110, castle.h - 70);

        ctx.beginPath();
        ctx.arc(castle.x + castle.w - 50, castle.y + 70, 55, Math.PI, 0, false);
        ctx.fill();
        ctx.fillRect(castle.x + castle.w - 105, castle.y + 70, 110, castle.h - 70);

        ctx.fillStyle = '#7a5431';
        ctx.fillRect(castle.x + 95, castle.y - 30, 190, castle.h + 30);
        ctx.beginPath();
        ctx.arc(castle.x + 190, castle.y - 30, 95, Math.PI, 0, false);
        ctx.fill();

        ctx.fillStyle = '#3a2412';
        for (let i = -5; i < castle.w + 5; i += 24) {
            ctx.fillRect(castle.x + i, castle.y - 48, 16, 20);
        }

        ctx.fillStyle = '#1a100a';
        ctx.fillRect(castle.x + 55, castle.y + 110, 12, 35);
        ctx.fillRect(castle.x + 140, castle.y + 30, 14, 35);
        ctx.fillRect(castle.x + 225, castle.y + 30, 14, 35);
        ctx.fillRect(castle.x + castle.w - 67, castle.y + 110, 12, 35);

        ctx.fillStyle = '#170d07';
        ctx.beginPath();
        ctx.arc(castle.x + castle.w / 2, castle.y + 210, 50, Math.PI, 0, false);
        ctx.fill();
        ctx.fillRect(castle.x + (castle.w / 2) - 50, castle.y + 210, 100, 130);

        ctx.strokeStyle = '#e6c547';
        ctx.lineWidth = 5;
        ctx.strokeRect(castle.x + (castle.w / 2) - 50, castle.y + 210, 100, 130);

        ctx.font = '40px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🇴🇲', castle.x + castle.w / 2, castle.y - 65);
        ctx.restore();

        if (!player.hidden) {
            ctx.save();
            if (!player.facingRight) {
                ctx.translate(player.x + player.width, player.y);
                ctx.scale(-1, 1);
                if (charLoaded) {
                    ctx.drawImage(charImg, 0, 0, player.width, player.height);
                } else {
                    ctx.fillStyle = '#d62828'; ctx.fillRect(0, 0, player.width, player.height);
                }
            } else {
                if (charLoaded) {
                    ctx.drawImage(charImg, player.x, player.y, player.width, player.height);
                } else {
                    ctx.fillStyle = '#d62828'; ctx.fillRect(player.x, player.y, player.width, player.height);
                }
            }
            ctx.restore();
        }

        fireworks.forEach(p => {
            ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI*2); ctx.fill(); ctx.restore();
        });

        ctx.restore();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    function restartGame() {
        selectRandomQuestions();
        player.x = 100; player.y = 260; player.vx = 0; player.vy = 0;
        player.hidden = false; score = 0; answeredCount = 0; collectedFlagsCount = 0;
        gameFinished = false; isPaused = false; fireworks = [];
        flagsList.forEach(f => f.collected = false);
        questionTriggers.forEach(q => q.active = true);
        document.getElementById('score-val').innerText = '0';
        document.getElementById('quest-val').innerText = '0 / 5';
        document.getElementById('win-screen').style.display = 'none';
    }

    loop();
</script>
</body>
</html>
