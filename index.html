<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامرة العيد الوطني العُماني المجيد</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer {
            position: relative;
            width: 1000px;
            height: 550px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* شاشات الواجهة Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            color: #D62612;
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px #000, 0 0 10px #007A3D;
        }

        p {
            font-size: 20px;
            margin-bottom: 25px;
            color: #f1f1f1;
            max-width: 600px;
            line-height: 1.6;
        }

        .btn {
            background: linear-gradient(135deg, #007A3D, #004d26);
            color: white;
            border: 2px solid #FFD700;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #D62612, #990000);
        }

        /* نافذة السؤال */
        .quiz-card {
            background: rgba(20, 20, 20, 0.95);
            border: 3px solid #FFD700;
            border-radius: 15px;
            padding: 30px;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .quiz-card h2 {
            color: #FFD700;
            margin-top: 0;
            font-size: 26px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .option-btn {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #555;
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            text-align: right;
        }

        .option-btn:hover {
            background: #007A3D;
            border-color: #FFD700;
        }

        /* أزرار التحكم للمس/الجوال */
        #touchControls {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 5;
            pointer-events: none;
        }

        .touch-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .touch-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
            user-select: none;
            touch-action: manipulation;
        }

        .touch-btn:active {
            background: rgba(0, 122, 61, 0.7);
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="1000" height="550"></canvas>

    <!-- الشاشة الرئيسية -->
    <div id="startScreen" class="overlay">
        <h1>مغامرة العيد الوطني العُماني</h1>
        <p>اجمع الإجابات الصحيحة من صناديق المعرفة (؟) واصل إلى القلعة العُمانية للاحتفال بالعيد الوطني المجيد!</p>
        <button class="btn" onclick="startGame()">ابدأ اللعب فوراً 🚀</button>
    </div>

    <!-- نافذة الأسئلة عند ضرب الصندوق -->
    <div id="quizScreen" class="overlay hidden">
        <div class="quiz-card">
            <h2 id="quizQuestion">السؤال هنا؟</h2>
            <div id="quizOptions" class="options-grid"></div>
        </div>
    </div>

    <!-- شاشة الفوز -->
    <div id="winScreen" class="overlay hidden">
        <h1 style="color: #FFD700;">كل عام وعُمان بخير! 🇴🇲</h1>
        <p>لقد أتممت المغامرة بنجاح ووصلت إلى القلعة العُمانية المجيدة!</p>
        <button class="btn" onclick="restartGame()">إعادة اللعب 🔄</button>
    </div>

    <!-- أزرار اللمس للجوال -->
    <div id="touchControls">
        <div class="touch-group">
            <div class="touch-btn" id="btnLeft">◀</div>
            <div class="touch-btn" id="btnRight">▶</div>
        </div>
        <div class="touch-group">
            <div class="touch-btn" id="btnJump">▲</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // تحميل الصور الخارجية
    const bgImage = new Image();
    bgImage.src = '814.webp'; // صورة الخلفية

    const playerImage = new Image();
    playerImage.src = '813.png'; // صورة الشخصية

    // محرك الصوتيات Web Audio API
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'jump') {
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'hitBlock') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'correct') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'firework') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100 + Math.random() * 200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // أسئلة المسابقة
    const questions = [
        {
            q: "ما هو تاريخ العيد الوطني العُماني؟",
            options: ["18 نوفمبر", "23 يوليو", "1 يناير", "18 ديسمبر"],
            answer: 0
        },
        {
            q: "ما هي عاصمة سلطنة عُمان؟",
            options: ["صلالة", "مسقط", "صحار", "نزوى"],
            answer: 1
        },
        {
            q: "ما هو رمز الخنجر العُماني على العلم؟",
            options: ["الأصالة والتراث", "القوة العسكرية", "الزراعة", "التجارة البحرية"],
            answer: 0
        }
    ];

    // حالة اللعبة
    let gameState = 'START'; // START, PLAYING, QUIZ, VICTORY_SEQUENCE, WIN
    let currentQuizIndex = 0;
    let activeBlock = null;

    // أزرار التحكم
    const keys = { right: false, left: false, up: false };

    // الكاميرا
    let cameraX = 0;
    const worldWidth = 3200;

    // اللاعب
    const player = {
        x: 100,
        y: 300,
        width: 50,
        height: 70,
        vx: 0,
        vy: 0,
        speed: 5,
        gravity: 0.6,
        jumpPower: -12,
        grounded: false,
        facing: 'right'
    };

    // المنصات
    const platforms = [
        { x: 0, y: 480, width: 1200, height: 70 },
        { x: 1350, y: 480, width: 1800, height: 70 },
        // منصات مرتفعة
        { x: 300, y: 350, width: 150, height: 20 },
        { x: 700, y: 320, width: 200, height: 20 },
        { x: 1400, y: 360, width: 180, height: 20 },
        { x: 1800, y: 300, width: 200, height: 20 }
    ];

    // صناديق الأسئلة (ماريو)
    const blocks = [
        { x: 350, y: 220, width: 40, height: 40, hit: false, questionIndex: 0 },
        { x: 780, y: 190, width: 40, height: 40, hit: false, questionIndex: 1 },
        { x: 1880, y: 170, width: 40, height: 40, hit: false, questionIndex: 2 }
    ];

    // نهاية المستوى (السارية والقلعة)
    const finishLine = {
        flagX: 2600,
        flagY: 180,
        poleHeight: 300,
        flagSlideY: 180,
        fortX: 2750,
        fortY: 230,
        fortWidth: 350,
        fortHeight: 250
    };

    // الألعاب النارية
    let fireworks = [];

    function createFirework() {
        const x = finishLine.fortX + Math.random() * finishLine.fortWidth;
        const y = finishLine.fortY - Math.random() * 150;
        const colors = ['#D62612', '#007A3D', '#FFD700', '#FFFFFF'];
        for (let i = 0; i < 25; i++) {
            fireworks.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                color: colors[Math.floor(Math.random() * colors.length)],
                life: 30 + Math.random() * 20
            });
        }
        playSound('firework');
    }

    // إعداد أزرار التحكم
    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') {
            if (!keys.up && player.grounded && gameState === 'PLAYING') {
                player.vy = player.jumpPower;
                player.grounded = false;
                playSound('jump');
            }
            keys.up = true;
        }
    });

    window.addEventListener('keyup', e => {
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = false;
    });

    // أدوات التحكم باللمس
    const setupTouchBtn = (id, keyName) => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            initAudio();
            if (keyName === 'up' && player.grounded && gameState === 'PLAYING') {
                player.vy = player.jumpPower;
                player.grounded = false;
                playSound('jump');
            }
            keys[keyName] = true;
        });
        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            keys[keyName] = false;
        });
    };

    setupTouchBtn('btnLeft', 'left');
    setupTouchBtn('btnRight', 'right');
    setupTouchBtn('btnJump', 'up');

    function startGame() {
        initAudio();
        document.getElementById('startScreen').classList.add('hidden');
        gameState = 'PLAYING';
    }

    function restartGame() {
        player.x = 100;
        player.y = 300;
        player.vx = 0;
        player.vy = 0;
        cameraX = 0;
        finishLine.flagSlideY = 180;
        blocks.forEach(b => b.hit = false);
        fireworks = [];
        document.getElementById('winScreen').classList.add('hidden');
        gameState = 'PLAYING';
    }

    // فتح شاشة السؤال
    function triggerQuiz(block) {
        gameState = 'QUIZ';
        activeBlock = block;
        const qData = questions[block.questionIndex];
        
        document.getElementById('quizQuestion').innerText = qData.q;
        const optionsContainer = document.getElementById('quizOptions');
        optionsContainer.innerHTML = '';

        qData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => answerQuiz(idx);
            optionsContainer.appendChild(btn);
        });

        document.getElementById('quizScreen').classList.remove('hidden');
    }

    function answerQuiz(selectedIndex) {
        const qData = questions[activeBlock.questionIndex];
        if (selectedIndex === qData.answer) {
            playSound('correct');
            activeBlock.hit = true;
            document.getElementById('quizScreen').classList.add('hidden');
            gameState = 'PLAYING';
        } else {
            alert('إجابة خاطئة! حاول مرة أخرى.');
        }
    }

    // تحديث الحركة والفيزياء
    function update() {
        if (gameState === 'PLAYING') {
            // حركة اللاعب أفقياً
            if (keys.right) {
                player.vx = player.speed;
                player.facing = 'right';
            } else if (keys.left) {
                player.vx = -player.speed;
                player.facing = 'left';
            } else {
                player.vx = 0;
            }

            // الجاذبية
            player.vy += player.gravity;

            // تطبيق السرعة
            player.x += player.vx;
            player.y += player.vy;

            // الحدود العالمية
            if (player.x < 0) player.x = 0;

            // إعادة تعيين حالة الأرضية
            player.grounded = false;

            // التصادم مع المنصات
            platforms.forEach(p => {
                if (player.x + player.width > p.x &&
                    player.x < p.x + p.width &&
                    player.y + player.height >= p.y &&
                    player.y + player.height <= p.y + player.vy + 10) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            });

            // التصادم مع صناديق الأسئلة (من الأسفل)
            blocks.forEach(b => {
                if (player.x + player.width > b.x &&
                    player.x < b.x + b.width &&
                    player.y <= b.y + b.height &&
                    player.y >= b.y + b.height + player.vy - 5) {
                    
                    player.y = b.y + b.height;
                    player.vy = 1;
                    if (!b.hit) {
                        playSound('hitBlock');
                        triggerQuiz(b);
                    }
                }
            });

            // السقوط في الحفرة
            if (player.y > canvas.height + 100) {
                player.x = 100;
                player.y = 300;
                player.vx = 0;
                player.vy = 0;
            }

            // الوصول لخط النهاية (سارية العلم)
            if (player.x + player.width >= finishLine.flagX) {
                gameState = 'VICTORY_SEQUENCE';
                player.x = finishLine.flagX - player.width / 2;
            }

            // تحديث موضع الكاميرا
            cameraX = player.x - canvas.width / 3;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > worldWidth - canvas.width) cameraX = worldWidth - canvas.width;
        } 
        else if (gameState === 'VICTORY_SEQUENCE') {
            // انزلاق علم عُمان والشخصية
            if (finishLine.flagSlideY < finishLine.flagY + finishLine.poleHeight - 50) {
                finishLine.flagSlideY += 3;
                player.y = finishLine.flagSlideY;
            } else {
                // الحركة نحو القلعة
                player.x += 3;
                player.facing = 'right';
                if (player.x >= finishLine.fortX + 100) {
                    gameState = 'WIN';
                    document.getElementById('winScreen').classList.remove('hidden');
                }
            }
        }

        // تحديث الألعاب النارية
        if (gameState === 'WIN' || gameState === 'VICTORY_SEQUENCE') {
            if (Math.random() < 0.1) createFirework();
            fireworks.forEach((f, index) => {
                f.x += f.vx;
                f.y += f.vy;
                f.life--;
                if (f.life <= 0) fireworks.splice(index, 1);
            });
        }
    }

    // دالة الرسم الرئيسية
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. رسم صورة الخلفية (تتحرك بطريقة البارالاكس)
        if (bgImage.complete && bgImage.naturalWidth !== 0) {
            // رسم صورتين بجانب بعضهما للحصول على خلفية مستمرة عند الحركة
            let bgX = -(cameraX * 0.3) % canvas.width;
            ctx.drawImage(bgImage, bgX, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImage, bgX + canvas.width, 0, canvas.width, canvas.height);
        } else {
            // خلفية احتياطية في حال عدم تحميل الصورة
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        ctx.save();
        ctx.translate(-cameraX, 0);

        // 2. رسم المنصات
        platforms.forEach(p => {
            // سطح المنصة
            ctx.fillStyle = '#007A3D';
            ctx.fillRect(p.x, p.y, p.width, 15);
            // عمق المنصة
            ctx.fillStyle = '#654321';
            ctx.fillRect(p.x, p.y + 15, p.width, p.height - 15);
        });

        // 3. رسم صناديق الأسئلة (؟)
        blocks.forEach(b => {
            if (!b.hit) {
                ctx.fillStyle = '#FFD700';
                ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.strokeStyle = '#B8860B';
                ctx.lineWidth = 3;
                ctx.strokeRect(b.x, b.y, b.width, b.height);

                // رسم علامة ؟
                ctx.fillStyle = '#D62612';
                ctx.font = 'bold 24px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText('؟', b.x + b.width / 2, b.y + 28);
            } else {
                ctx.fillStyle = '#8B8B8B';
                ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.strokeRect(b.x, b.y, b.width, b.height);

                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 20px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText('✓', b.x + b.width / 2, b.y + 26);
            }
        });

        // 4. رسم القلعة العُمانية في نهاية المستوى
        // بناء القلعة
        ctx.fillStyle = '#C2B280';
        ctx.fillRect(finishLine.fortX, finishLine.fortY, finishLine.fortWidth, finishLine.fortHeight);
        // أبراج القلعة
        ctx.fillRect(finishLine.fortX - 30, finishLine.fortY - 40, 70, finishLine.fortHeight + 40);
        ctx.fillRect(finishLine.fortX + finishLine.fortWidth - 40, finishLine.fortY - 40, 70, finishLine.fortHeight + 40);
        // بوابة القلعة
        ctx.fillStyle = '#4A2E12';
        ctx.beginPath();
        ctx.arc(finishLine.fortX + finishLine.fortWidth / 2, finishLine.fortY + finishLine.fortHeight, 40, Math.PI, 0, false);
        ctx.fill();

        // 5. رسم سارية العلم (نهاية ماريو)
        ctx.fillStyle = '#DDD';
        ctx.fillRect(finishLine.flagX, finishLine.flagY, 8, finishLine.poleHeight);
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(finishLine.flagX + 4, finishLine.flagY, 10, 0, Math.PI * 2);
        ctx.fill();

        // رسم علم عُمان المنزلق
        let flagY = finishLine.flagSlideY;
        ctx.fillStyle = '#D62612';
        ctx.fillRect(finishLine.flagX + 8, flagY, 50, 30);
        ctx.fillStyle = '#FFF';
        ctx.fillRect(finishLine.flagX + 8, flagY, 50, 10);
        ctx.fillStyle = '#007A3D';
        ctx.fillRect(finishLine.flagX + 8, flagY + 20, 50, 10);

        // 6. رسم صورة الشخصية
        ctx.save();
        ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
        
        // عكس الاتجاه إذا كانت الشخصية تنظر لليسار
        if (player.facing === 'left') {
            ctx.scale(-1, 1);
        }

        if (playerImage.complete && playerImage.naturalWidth !== 0) {
            ctx.drawImage(
                playerImage,
                -player.width / 2,
                -player.height / 2,
                player.width,
                player.height
            );
        } else {
            // رسم افتراضي للشخصية إذا لم يتم تحميل الصورة
            ctx.fillStyle = '#D62612';
            ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
        }
        ctx.restore();

        // 7. رسم الألعاب النارية
        fireworks.forEach(f => {
            ctx.fillStyle = f.color;
            ctx.beginPath();
            ctx.arc(f.x, f.y, 3, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.restore();
    }

    // الحلقة الرئيسية للعبة
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // بدء تشغيل اللعبة
    gameLoop();
</script>

</body>
</html>
