<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مغامرات في بلادي 🇴🇲</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body { font-family: Tahoma, sans-serif; background-color: #111; color: #fff; overflow: hidden; touch-action: none; direction: rtl; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #000; }
        canvas { background-color: #87CEEB; box-shadow: 0 0 20px rgba(0, 0, 0, 0.8); max-width: 100%; max-height: 100%; }
        #hud { position: absolute; top: 15px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; }
        .hud-card { background: rgba(255, 255, 255, 0.95); color: #d62828; padding: 8px 18px; border-radius: 20px; font-size: 20px; font-weight: bold; border: 2px solid #007a3d; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        #touch-controls { position: absolute; bottom: 25px; left: 25px; right: 25px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; }
        .control-group { display: flex; gap: 20px; pointer-events: auto; }
        .btn-touch { width: 85px; height: 85px; background: rgba(255, 255, 255, 0.9); border: 4px solid #007a3d; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 35px; color: #007a3d; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-touch:active, .btn-touch.pressed { background: #007a3d; color: #fff; transform: scale(0.95); }
        .btn-jump { border-color: #d62828; color: #d62828; width: 95px; height: 95px; border-radius: 50%; }
        .btn-jump:active, .btn-jump.pressed { background: #d62828; color: #fff; }
        .modal { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: #fff; border: 4px solid #007a3d; border-radius: 20px; padding: 20px; text-align: center; color: #333; z-index: 20; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal h2 { color: #d62828; margin-bottom: 15px; }
        .question-text { font-size: 19px; margin-bottom: 15px; font-weight: bold; }
        .btn-option { background: #f8f9fa; border: 2px solid #007a3d; padding: 10px; border-radius: 12px; font-size: 17px; font-weight: bold; width: 100%; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
        .btn-option:hover { background: #007a3d; color: #fff; }
        #win-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 480px; background: #fff; border: 5px solid #d62828; border-radius: 25px; padding: 22px; text-align: center; color: #333; z-index: 30; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .win-details { background: #f8f9fa; border: 2px dashed #007a3d; padding: 12px; border-radius: 15px; margin: 15px 0; font-size: 17px; color: #333; text-align: right; display: flex; flex-direction: column; gap: 8px; }
        .btn-restart { margin-top: 10px; background: #007a3d; color: white; border: none; padding: 12px 30px; font-size: 19px; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-restart:hover { background: #005a2d; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <div id="hud">
        <div class="hud-card"><span>🇴🇲 الأعلام:</span><span id="score-val">0</span></div>
        <div class="hud-card"><span>❓ الأسئلة:</span><span id="quest-val">0 / 5</span></div>
    </div>

    <div id="touch-controls">
        <div class="control-group">
            <div class="btn-touch" id="btn-left" style="transform: scaleX(-1);">➔</div>
            <div class="btn-touch" id="btn-right">➔</div>
        </div>
        <div class="control-group">
            <div class="btn-touch btn-jump" id="btn-jump">⬆</div>
        </div>
    </div>

    <div class="modal" id="question-modal">
        <h2>سؤال عن سلطنة عُمان 🇴🇲</h2>
        <div class="question-text" id="modal-question"></div>
        <div id="modal-options"></div>
        <div id="feedback-msg" style="margin-top:8px; font-weight:bold;"></div>
    </div>

    <div id="win-screen">
        <h1 style="color:#d62828; font-size: 24px;">🎉 أحسنت بطل عُمان! 🇴🇲</h1>
        <p style="font-size:16px; margin: 5px 0;">أكملت مغامرة العيد الوطني بنجاح!</p>
        
        <div class="win-details">
            <div>✅ <strong>الأسئلة الصحيحة:</strong> <span id="final-questions">0</span> من 5</div>
            <div>🇴🇲 <strong>الأعلام المجمعة:</strong> <span id="final-flags">0</span> من 10</div>
            <div style="color:#007a3d; font-weight:bold; border-top: 1px solid #ddd; padding-top: 5px; margin-top: 2px;">⭐ <strong>المجموع الكلي:</strong> <span id="final-score">0</span> نقطة</div>
        </div>

        <button class="btn-restart" onclick="restartGame()">🔄 العب مرة أخرى</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSound(type) {
        try {
            initAudio();
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'flag') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(880, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'win') {
                let notes = [300, 400, 500, 650, 800];
                notes.forEach((freq, i) => {
                    let o = audioCtx.createOscillator();
                    let g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(freq, now + i * 0.1);
                    g.gain.setValueAtTime(0.2, now + i * 0.1);
                    g.gain.linearRampToValueAtTime(0.01, now + i * 0.1 + 0.15);
                    o.start(now + i * 0.1);
                    o.stop(now + i * 0.1 + 0.15);
                });
            }
        } catch(e) {}
    }

    let charImg = new Image();
    charImg.src = '813.png';
    let charLoaded = false;
    charImg.onload = () => { charLoaded = true; };

    let bgImg = new Image();
    bgImg.src = '814.webp';
    let bgLoaded = false;
    bgImg.onload = () => { bgLoaded = true; };

    // بنك الأسئلة مع تحديد 20 نوفمبر كإجابة صحيحة لسؤال اليوم الوطني
    const allQuestions = [
        { q: "ما عاصمة سلطنة عُمان؟", options: ["صلالة", "مسقط", "صحار", "نزوى"], answer: 1 },
        { q: "متى تحتفل سلطنة عُمان باليوم الوطني؟", options: ["18 نوفمبر", "20 نوفمبر", "23 يوليو", "11 يناير"], answer: 1 },
        { q: "ما العملة الرسمية في سلطنة عُمان؟", options: ["الدرهم", "الدينار", "الريال العُماني", "الريال السعودي"], answer: 2 },
        { q: "ما ألوان علم سلطنة عُمان؟", options: ["الأحمر والأبيض والأخضر", "الأزرق والأبيض", "الأصفر والأخضر", "الأسود والأحمر"], answer: 0 },
        { q: "في أي محافظة تقع مدينة صلالة؟", options: ["مسقط", "ظفار", "الداخلية", "شمال الباطنة"], answer: 1 },
        { q: "ما أعلى جبل في سلطنة عُمان؟", options: ["جبل شمس", "جبل سمحان", "جبل حفيت", "جبل الأخضر"], answer: 0 },
        { q: "ما الحيوان الذي يُعد من الرموز الوطنية في سلطنة عُمان؟", options: ["المها العربي", "الفيل", "النمر", "الغزال الهندي"], answer: 0 }
    ];

    let activeQuestions = [];
    function selectRandomQuestions() {
        let shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
        activeQuestions = shuffled.slice(0, 5);
    }
    selectRandomQuestions();

    let cameraX = 0, score = 0, answeredCount = 0, collectedFlagsCount = 0, isPaused = false, gameFinished = false;

    const player = { x: 100, y: 260, width: 95, height: 115, vx: 0, vy: 0, speed: 5, jumpPower: -13, gravity: 0.6, grounded: false, facingRight: true, hidden: false };

    const platforms = [
        { x: 0, y: 420, w: 3200, h: 80 },
        { x: 300, y: 320, w: 140, h: 20 },
        { x: 550, y: 260, w: 140, h: 20 },
        { x: 900, y: 310, w: 150, h: 20 },
        { x: 1200, y: 250, w: 160, h: 20 },
        { x: 1550, y: 320, w: 140, h: 20 },
        { x: 1850, y: 270, w: 150, h: 20 },
        { x: 2200, y: 320, w: 160, h: 20 }
    ];

    // أحجار في الأرضية ليضطر اللاعب للقفز فوقها
    const stones = [
        { x: 450, y: 380, w: 40, h: 40 },
        { x: 800, y: 375, w: 45, h: 45 },
        { x: 1350, y: 380, w: 40, h: 40 },
        { x: 1750, y: 370, w: 50, h: 50 },
        { x: 2350, y: 380, w: 40, h: 40 }
    ];

    let flagsList = [
        { x: 340, y: 270, collected: false }, { x: 400, y: 370, collected: false },
        { x: 600, y: 210, collected: false }, { x: 750, y: 370, collected: false },
        { x: 950, y: 260, collected: false }, { x: 1250, y: 200, collected: false },
        { x: 1400, y: 370, collected: false }, { x: 1600, y: 270, collected: false },
        { x: 1900, y: 220, collected: false }, { x: 2250, y: 270, collected: false }
    ];

    let questionTriggers = [
        { x: 500, qIndex: 0, active: true }, { x: 1000, qIndex: 1, active: true },
        { x: 1500, qIndex: 2, active: true }, { x: 2000, qIndex: 3, active: true },
        { x: 2500, qIndex: 4, active: true }
    ];

    const castle = { x: 2800, y: 150, w: 280, h: 270, doorX: 2910 };
    let fireworks = [];

    const keys = { left: false, right: false };

    window.addEventListener('keydown', (e) => {
        initAudio();
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
        if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') jump();
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    function bindButton(id, actionPress, actionRelease) {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('pointerdown', (e) => { e.preventDefault(); initAudio(); el.classList.add('pressed'); actionPress(); });
        el.addEventListener('pointerup', (e) => { e.preventDefault(); el.classList.remove('pressed'); actionRelease(); });
        el.addEventListener('pointerleave', (e) => { e.preventDefault(); el.classList.remove('pressed'); actionRelease(); });
    }

    bindButton('btn-left', () => { keys.left = true; }, () => { keys.left = false; });
    bindButton('btn-right', () => { keys.right = true; }, () => { keys.right = false; });
    bindButton('btn-jump', () => { jump(); }, () => {});

    function jump() {
        if (player.grounded && !isPaused && !gameFinished) {
            player.vy = player.jumpPower;
            player.grounded = false;
            playSound('jump');
        }
    }

    function openQuestionModal(qIndex) {
        isPaused = true;
        player.vx = 0;
        keys.left = false; keys.right = false;
        const qData = activeQuestions[qIndex];
        document.getElementById('modal-question').innerText = qData.q;
        const optionsDiv = document.getElementById('modal-options');
        optionsDiv.innerHTML = '';
        document.getElementById('feedback-msg').innerText = '';

        qData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => {
                if (idx === qData.answer) {
                    playSound('flag');
                    document.getElementById('feedback-msg').style.color = '#007a3d';
                    document.getElementById('feedback-msg').innerText = '🎉 أحسنت! إجابة صحيحة!';
                    score += 5; answeredCount++;
                    document.getElementById('score-val').innerText = score;
                    document.getElementById('quest-val').innerText = `${answeredCount} / 5`;
                    setTimeout(() => {
                        document.getElementById('question-modal').style.display = 'none';
                        isPaused = false;
                    }, 1000);
                } else {
                    document.getElementById('feedback-msg').style.color = '#d62828';
                    document.getElementById('feedback-msg').innerText = '😊 حاول مرة أخرى!';
                }
            };
            optionsDiv.appendChild(btn);
        });
        document.getElementById('question-modal').style.display = 'block';
    }

    function update() {
        if (isPaused) return;
        if (!gameFinished) {
            if (keys.left) { player.vx = -player.speed; player.facingRight = false; }
            else if (keys.right) { player.vx = player.speed; player.facingRight = true; }
            else { player.vx = 0; }
        } else { player.vx = 0; }

        player.vy += player.gravity;
        player.x += player.vx;
        player.y += player.vy;
        if (player.x < 10) player.x = 10;

        player.grounded = false;
        
        // التحقق من الاصطدام بالمنصات العلوية
        platforms.forEach(plat => {
            if (player.x < plat.x + plat.w && player.x + player.width > plat.x &&
                player.y + player.height >= plat.y && player.y + player.height <= plat.y + plat.h + player.vy) {
                if (player.vy >= 0) { player.grounded = true; player.vy = 0; player.y = plat.y - player.height; }
            }
        });

        // التحقق من الاصطدام بالأحجار الأرضية (القفز فوقها أو الاصطدام الجانبي)
        stones.forEach(stone => {
            // الهبوط فوق الحجر
            if (player.x < stone.x + stone.w && player.x + player.width > stone.x &&
                player.y + player.height >= stone.y && player.y + player.height <= stone.y + stone.h + player.vy) {
                if (player.vy >= 0) {
                    player.grounded = true;
                    player.vy = 0;
                    player.y = stone.y - player.height;
                }
            }
            // الاصطدام بجانب الحجر أفقياً
            if (player.y + player.height > stone.y && player.y < stone.y + stone.h) {
                if (player.facingRight && player.x + player.width >= stone.x && player.x < stone.x) {
                    player.x = stone.x - player.width;
                } else if (!player.facingRight && player.x <= stone.x + stone.w && player.x + player.width > stone.x + stone.w) {
                    player.x = stone.x + stone.w;
                }
            }
        });

        if (player.y > canvas.height + 50) { player.x = Math.max(100, player.x - 200); player.y = 200; player.vy = 0; }

        if (!gameFinished) {
            flagsList.forEach(flag => {
                if (!flag.collected && player.x < flag.x + 35 && player.x + player.width > flag.x &&
                    player.y < flag.y + 35 && player.y + player.height > flag.y) {
                    flag.collected = true; score += 1; collectedFlagsCount++;
                    document.getElementById('score-val').innerText = score;
                    playSound('flag');
                }
            });

            questionTriggers.forEach(q => {
                if (q.active && player.x >= q.x) { q.active = false; openQuestionModal(q.qIndex); }
            });
        }

        cameraX = player.x - canvas.width / 3;
        if (cameraX < 0) cameraX = 0;

        if (!gameFinished && player.x >= castle.doorX) {
            gameFinished = true; player.hidden = true;
            playSound('win');
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    for (let f = 0; f < 35; f++) {
                        fireworks.push({ x: castle.x + 140, y: castle.y + 50, vx: (Math.random()-0.5)*9, vy: (Math.random()-0.5)*9, color: ['#d62828','#007a3d','#fff','#ffd166'][Math.floor(Math.random()*4)], alpha: 1 });
                    }
                }, i * 400);
            }
            setTimeout(() => {
                document.getElementById('final-questions').innerText = answeredCount;
                document.getElementById('final-flags').innerText = collectedFlagsCount;
                document.getElementById('final-score').innerText = score;
                document.getElementById('win-screen').style.display = 'block';
            }, 2500);
        }

        if (gameFinished) {
            fireworks.forEach(p => { p.x += p.vx; p.y += p.vy; p.alpha -= 0.02; });
            fireworks = fireworks.filter(p => p.alpha > 0);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (bgLoaded) {
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        ctx.save();
        ctx.translate(-cameraX, 0);

        platforms.forEach(p => {
            ctx.fillStyle = '#007a3d'; ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = '#d62828'; ctx.fillRect(p.x, p.y, p.w, 5);
        });

        // رسم الأحجار على الطريق
        stones.forEach(stone => {
            ctx.save();
            ctx.fillStyle = '#7f8c8d';
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(stone.x, stone.y, stone.w, stone.h, [8, 8, 2, 2]);
            ctx.fill();
            ctx.stroke();
            // تفاصيل الحجر الجمالية
            ctx.fillStyle = '#95a5a6';
            ctx.fillRect(stone.x + 8, stone.y + 8, 10, 8);
            ctx.restore();
        });

        flagsList.forEach(f => {
            if (!f.collected) {
                ctx.save();
                ctx.font = '36px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🇴🇲', f.x + 15, f.y + 15);
                ctx.restore();
            }
        });

        questionTriggers.forEach(q => {
            if (q.active) {
                ctx.save();
                ctx.fillStyle = '#ffd166';
                ctx.fillRect(q.x - 5, 365, 45, 45);
                ctx.strokeStyle = '#d62828';
                ctx.lineWidth = 3;
                ctx.strokeRect(q.x - 5, 365, 45, 45);
                ctx.font = '26px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🎁', q.x + 17, 388);
                ctx.restore();
            }
        });

        ctx.fillStyle = '#c5a059'; ctx.fillRect(castle.x, castle.y, castle.w, castle.h);
        ctx.fillStyle = '#a37033'; 
        ctx.fillRect(castle.x - 20, castle.y - 40, 50, castle.h + 40);
        ctx.fillRect(castle.x + castle.w - 30, castle.y - 40, 50, castle.h + 40);
        
        ctx.fillStyle = '#8b5a2b';
        for (let i = -20; i < 30; i += 15) ctx.fillRect(castle.x + i, castle.y - 55, 10, 15);
        for (let i = castle.w - 30; i < castle.w + 20; i += 15) ctx.fillRect(castle.x + i, castle.y - 55, 10, 15);

        for (let i = 40; i < castle.w - 40; i += 30) ctx.fillRect(castle.x + i, castle.y - 18, 20, 18);

        ctx.fillStyle = '#3a2e2b'; 
        ctx.beginPath();
        ctx.arc(castle.x + 140, castle.y + 160, 35, Math.PI, 0, false);
        ctx.fill();
        ctx.fillRect(castle.x + 105, castle.y + 160, 70, 110);

        ctx.strokeStyle = '#222'; ctx.lineWidth = 4;
        ctx.strokeRect(castle.x + 105, castle.y + 160, 70, 110);
        ctx.font = '24px sans-serif';
        ctx.fillText('🇴🇲', castle.x + 125, castle.y + 70);

        if (!player.hidden) {
            ctx.save();
            if (!player.facingRight) {
                ctx.translate(player.x + player.width, player.y);
                ctx.scale(-1, 1);
                if (charLoaded) {
                    ctx.drawImage(charImg, 0, 0, player.width, player.height);
                } else {
                    ctx.fillStyle = '#d62828'; ctx.fillRect(0, 0, player.width, player.height);
                }
            } else {
                if (charLoaded) {
                    ctx.drawImage(charImg, player.x, player.y, player.width, player.height);
                } else {
                    ctx.fillStyle = '#d62828'; ctx.fillRect(player.x, player.y, player.width, player.height);
                }
            }
            ctx.restore();
        }

        fireworks.forEach(p => {
            ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fill(); ctx.restore();
        });

        ctx.restore();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    function restartGame() {
        selectRandomQuestions();
        player.x = 100; player.y = 260; player.vx = 0; player.vy = 0;
        player.hidden = false; score = 0; answeredCount = 0; collectedFlagsCount = 0;
        gameFinished = false; isPaused = false; fireworks = [];
        flagsList.forEach(f => f.collected = false);
        questionTriggers.forEach(q => q.active = true);
        document.getElementById('score-val').innerText = '0';
        document.getElementById('quest-val').innerText = '0 / 5';
        document.getElementById('win-screen').style.display = 'none';
    }

    loop();
</script>
</body>
</html>
