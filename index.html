<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مغامرة العيد الوطني العُماني 🇴🇲</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body { font-family: Tahoma, sans-serif; background-color: #111; color: #fff; overflow: hidden; touch-action: manipulation; direction: rtl; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #000; }
        canvas { background-color: #87CEEB; box-shadow: 0 0 20px rgba(0, 0, 0, 0.8); max-width: 100%; max-height: 100%; }
        #hud { position: absolute; top: 15px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; }
        .hud-card { background: rgba(255, 255, 255, 0.95); color: #d62828; padding: 8px 18px; border-radius: 20px; font-size: 20px; font-weight: bold; border: 2px solid #007a3d; display: flex; align-items: center; gap: 8px; }
        #touch-controls { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; }
        .control-group { display: flex; gap: 15px; pointer-events: auto; }
        .btn-touch { width: 75px; height: 75px; background: rgba(255, 255, 255, 0.9); border: 3px solid #007a3d; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; color: #007a3d; cursor: pointer; }
        .btn-touch:active { background: #007a3d; color: #fff; }
        .btn-jump { border-color: #d62828; color: #d62828; width: 85px; height: 85px; border-radius: 42px; }
        .btn-jump:active { background: #d62828; color: #fff; }
        .modal { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: #fff; border: 4px solid #007a3d; border-radius: 20px; padding: 20px; text-align: center; color: #333; z-index: 20; display: none; }
        .modal h2 { color: #d62828; margin-bottom: 15px; }
        .question-text { font-size: 20px; margin-bottom: 20px; font-weight: bold; }
        .btn-option { background: #f8f9fa; border: 2px solid #007a3d; padding: 12px; border-radius: 12px; font-size: 18px; font-weight: bold; width: 100%; margin-bottom: 10px; cursor: pointer; }
        .btn-option:hover { background: #007a3d; color: #fff; }
        #win-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 480px; background: #fff; border: 5px solid #d62828; border-radius: 25px; padding: 25px; text-align: center; color: #333; z-index: 30; display: none; }
        .btn-restart { margin-top: 20px; background: #007a3d; color: white; border: none; padding: 12px 30px; font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <div id="hud">
        <div class="hud-card"><span>🇴🇲 الأعلام:</span><span id="score-val">0</span></div>
        <div class="hud-card"><span>❓ الأسئلة:</span><span id="quest-val">0 / 5</span></div>
    </div>

    <div id="touch-controls">
        <div class="control-group">
            <div class="btn-touch" id="btn-left" style="transform: scaleX(-1);">➔</div>
            <div class="btn-touch" id="btn-right">➔</div>
        </div>
        <div class="control-group">
            <div class="btn-touch btn-jump" id="btn-jump">⬆</div>
        </div>
    </div>

    <div class="modal" id="question-modal">
        <h2 id="modal-title">سؤال العيد الوطني 🇴🇲</h2>
        <div class="question-text" id="modal-question"></div>
        <div id="modal-options"></div>
        <div id="feedback-msg" style="margin-top:10px; font-weight:bold;"></div>
    </div>

    <div id="win-screen">
        <h1 style="color:#d62828;">🎉 أحسنت بطل عُمان! 🎉</h1>
        <p style="font-size:18px; margin: 10px 0;">أكملت مغامرة العيد الوطني بنجاح!</p>
        <p style="font-size: 20px; color:#007a3d; margin: 15px 0;"><strong>المجموع الكلي:</strong> <span id="final-score">0</span> نقطة</p>
        <button class="btn-restart" onclick="restartGame()">🔄 العب مرة أخرى</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // تحميل الصور مع حماية في حال عدم توفر الملفات
    let charImg = new Image();
    charImg.src = '813.png';
    let charLoaded = false;
    charImg.onload = () => { charLoaded = true; };

    let bgImg = new Image();
    bgImg.src = '814.webp';
    let bgLoaded = false;
    bgImg.onload = () => { bgLoaded = true; };

    const questions = [
        { q: "ما اسم بلدنا العزيز؟", options: ["عُمان 🇴🇲", "مصر 🇪🇬"], answer: 0 },
        { q: "ما هو اللون الموجود في علم عُمان؟", options: ["الأحمر 🔴", "الأصفر 🟡"], answer: 0 },
        { q: "ماذا نرفع بفخر في الاحتفالات الوطنية؟", options: ["علم عُمان 🇴🇲", "كتاب 📖"], answer: 0 },
        { q: "ماذا نشاهد يزين السماء في الاحتفالات؟", options: ["الألعاب النارية 🎆", "الثلج ❄️"], answer: 0 },
        { q: "ماذا نقول لسلطنة عُمان في عيدها الوطني؟", options: ["كل عام وعُمان بخير 🇴🇲", "صباح الخير فقط ☀️"], answer: 0 }
    ];

    let cameraX = 0, score = 0, answeredCount = 0, isPaused = false, gameFinished = false;

    const player = { x: 100, y: 300, width: 60, height: 75, vx: 0, vy: 0, speed: 5, jumpPower: -13, gravity: 0.6, grounded: false, facingRight: true, hidden: false };

    const platforms = [
        { x: 0, y: 420, w: 3200, h: 80 },
        { x: 300, y: 320, w: 140, h: 20 },
        { x: 550, y: 260, w: 140, h: 20 },
        { x: 900, y: 310, w: 150, h: 20 },
        { x: 1200, y: 250, w: 160, h: 20 },
        { x: 1550, y: 320, w: 140, h: 20 },
        { x: 1850, y: 270, w: 150, h: 20 },
        { x: 2200, y: 320, w: 160, h: 20 }
    ];

    let flagsList = [
        { x: 340, y: 270, collected: false }, { x: 400, y: 370, collected: false },
        { x: 600, y: 210, collected: false }, { x: 750, y: 370, collected: false },
        { x: 950, y: 260, collected: false }, { x: 1250, y: 200, collected: false },
        { x: 1400, y: 370, collected: false }, { x: 1600, y: 270, collected: false },
        { x: 1900, y: 220, collected: false }, { x: 2250, y: 270, collected: false }
    ];

    let questionTriggers = [
        { x: 500, qIndex: 0, active: true }, { x: 1000, qIndex: 1, active: true },
        { x: 1500, qIndex: 2, active: true }, { x: 2000, qIndex: 3, active: true },
        { x: 2500, qIndex: 4, active: true }
    ];

    const castle = { x: 2800, y: 180, w: 260, h: 240, doorX: 2900 };
    let fireworks = [];

    // التحكم
    const keys = { left: false, right: false };
    window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft') keys.left = true;
        if (e.code === 'ArrowRight') keys.right = true;
        if (e.code === 'Space' || e.code === 'ArrowUp') jump();
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft') keys.left = false;
        if (e.code === 'ArrowRight') keys.right = false;
    });

    document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
    document.getElementById('btn-left').addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
    document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
    document.getElementById('btn-right').addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });
    document.getElementById('btn-jump').addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });

    function jump() {
        if (player.grounded && !isPaused && !gameFinished) {
            player.vy = player.jumpPower;
            player.grounded = false;
        }
    }

    function openQuestionModal(qIndex) {
        isPaused = true;
        player.vx = 0;
        const qData = questions[qIndex];
        document.getElementById('modal-question').innerText = qData.q;
        const optionsDiv = document.getElementById('modal-options');
        optionsDiv.innerHTML = '';
        document.getElementById('feedback-msg').innerText = '';

        qData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => {
                if (idx === qData.answer) {
                    document.getElementById('feedback-msg.').innerText = "";
                    document.getElementById('feedback-msg').style.color = '#007a3d';
                    document.getElementById('feedback-msg').innerText = '🎉 أحسنت! إجابة صحيحة!';
                    score += 5; answeredCount++;
                    document.getElementById('score-val').innerText = score;
                    document.getElementById('quest-val').innerText = `${answeredCount} / 5`;
                    setTimeout(() => {
                        document.getElementById('question-modal').style.display = 'none';
                        isPaused = false;
                    }, 1000);
                } else {
                    document.getElementById('feedback-msg').style.color = '#d62828';
                    document.getElementById('feedback-msg').innerText = '😊 حاول مرة أخرى!';
                }
            };
            optionsDiv.appendChild(btn);
        });
        document.getElementById('question-modal').style.display = 'block';
    }

    function update() {
        if (isPaused) return;
        if (!gameFinished) {
            if (keys.left) { player.vx = -player.speed; player.facingRight = false; }
            else if (keys.right) { player.vx = player.speed; player.facingRight = true; }
            else { player.vx = 0; }
        } else { player.vx = 0; }

        player.vy += player.gravity;
        player.x += player.vx;
        player.y += player.vy;
        if (player.x < 10) player.x = 10;

        player.grounded = false;
        platforms.forEach(plat => {
            if (player.x < plat.x + plat.w && player.x + player.width > plat.x &&
                player.y + player.height >= plat.y && player.y + player.height <= plat.y + plat.h + player.vy) {
                if (player.vy >= 0) { player.grounded = true; player.vy = 0; player.y = plat.y - player.height; }
            }
        });

        if (player.y > canvas.height + 50) { player.x = Math.max(100, player.x - 200); player.y = 200; player.vy = 0; }

        if (!gameFinished) {
            flagsList.forEach(flag => {
                if (!flag.collected && player.x < flag.x + 30 && player.x + player.width > flag.x &&
                    player.y < flag.y + 30 && player.y + player.height > flag.y) {
                    flag.collected = true; score += 1;
                    document.getElementById('score-val').innerText = score;
                }
            });

            questionTriggers.forEach(q => {
                if (q.active && player.x >= q.x) { q.active = false; openQuestionModal(q.qIndex); }
            });
        }

        cameraX = player.x - canvas.width / 3;
        if (cameraX < 0) cameraX = 0;

        if (!gameFinished && player.x >= castle.doorX) {
            gameFinished = true; player.hidden = true;
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    for (let f = 0; f < 30; f++) {
                        fireworks.push({ x: castle.x + 100, y: castle.y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, color: ['#d62828','#007a3d','#fff'][Math.floor(Math.random()*3)], alpha: 1 });
                    }
                }, i * 400);
            }
            setTimeout(() => {
                document.getElementById('final-score').innerText = score;
                document.getElementById('win-screen').style.display = 'block';
            }, 2500);
        }

        if (gameFinished) {
            fireworks.forEach(p => { p.x += p.vx; p.y += p.vy; p.alpha -= 0.02; });
            fireworks = fireworks.filter(p => p.alpha > 0);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (bgLoaded) {
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        ctx.save();
        ctx.translate(-cameraX, 0);

        platforms.forEach(p => {
            ctx.fillStyle = '#007a3d'; ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = '#d62828'; ctx.fillRect(p.x, p.y, p.w, 5);
        });

        flagsList.forEach(f => {
            if (!f.collected) {
                ctx.fillStyle = '#fff'; ctx.fillRect(f.x, f.y, 30, 20);
                ctx.fillStyle = '#d62828'; ctx.fillRect(f.x, f.y, 10, 20);
                ctx.fillStyle = '#007a3d'; ctx.fillRect(f.x+10, f.y+13, 20, 7);
                ctx.fillStyle = '#666'; ctx.fillRect(f.x-3, f.y, 3, 30);
            }
        });

        questionTriggers.forEach(q => {
            if (q.active) { ctx.font = '28px sans-serif'; ctx.fillText('❓', q.x, 380); }
        });

        // القلعة
        ctx.fillStyle = '#d4a373'; ctx.fillRect(castle.x, castle.y, castle.w, castle.h);
        ctx.fillStyle = '#bc6c25';
        for (let i = 0; i < castle.w; i += 30) ctx.fillRect(castle.x + i, castle.y - 15, 18, 15);

        // اللاعب
        if (!player.hidden) {
            if (charLoaded) {
                ctx.drawImage(charImg, player.x, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = '#d62828'; ctx.fillRect(player.x, player.y, player.width, player.height);
            }
        }

        fireworks.forEach(p => {
            ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill(); ctx.restore();
        });

        ctx.restore();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    function restartGame() {
        player.x = 100; player.y = 300; player.vx = 0; player.vy = 0;
        player.hidden = false; score = 0; answeredCount = 0;
        gameFinished = false; isPaused = false; fireworks = [];
        flagsList.forEach(f => f.collected = false);
        questionTriggers.forEach(q => q.active = true);
        document.getElementById('score-val').innerText = '0';
        document.getElementById('quest-val').innerText = '0 / 5';
        document.getElementById('win-screen').style.display = 'none';
    }

    loop();
</script>
</body>
</html>
