<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مغامرة العيد الوطني العُماني 🇴🇲</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #fff;
            overflow: hidden;
            touch-action: manipulation;
            direction: rtl;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        canvas {
            background-color: #87CEEB;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            max-width: 100%;
            max-height: 100%;
        }
        /* Top HUD */
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        .hud-card {
            background: rgba(255, 255, 255, 0.9);
            color: #d62828;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid #007a3d;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* Touch Controls */
        #touch-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }
        .control-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .btn-touch {
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(220,220,220,0.9));
            border: 3px solid #007a3d;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            color: #007a3d;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            cursor: pointer;
            active-scale: 0.95;
        }
        .btn-touch:active {
            transform: scale(0.92);
            background: #007a3d;
            color: #fff;
        }
        .btn-jump {
            border-color: #d62828;
            color: #d62828;
            width: 80px;
            height: 80px;
            border-radius: 40px;
        }
        .btn-jump:active {
            background: #d62828;
            color: #fff;
        }
        /* Modal Window for Questions */
        .modal {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.98);
            border: 4px solid #007a3d;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            color: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 20;
            display: none;
        }
        .modal h2 {
            color: #d62828;
            margin-bottom: 15px;
            font-size: 24px;
        }
        .modal .question-text {
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .btn-option {
            background: #f8f9fa;
            border: 2px solid #007a3d;
            padding: 12px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-option:hover {
            background: #007a3d;
            color: #fff;
        }
        #feedback-msg {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
        }
        /* Win Screen */
        #win-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 480px;
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            border: 5px solid #d62828;
            border-radius: 25px;
            padding: 25px;
            text-align: center;
            color: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 30;
            display: none;
        }
        #win-screen h1 {
            color: #d62828;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .btn-restart {
            margin-top: 20px;
            background: #007a3d;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-restart:hover {
            background: #005a2d;
        }
        /* File Input Bar */
        #file-input-bar {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            display: flex;
            gap: 10px;
        }
        #file-input-bar label {
            cursor: pointer;
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-card">
            <span>🇴🇲 الأعلام:</span>
            <span id="score-val">0</span>
        </div>
        <div class="hud-card">
            <span>❓ الأسئلة:</span>
            <span id="quest-val">0 / 5</span>
        </div>
    </div>

    <!-- Touch Controls -->
    <div id="touch-controls">
        <div class="control-group">
            <div class="btn-touch" id="btn-left">➔</div>
            <div class="btn-touch" id="btn-right">➔</div>
        </div>
        <div class="control-group">
            <div class="btn-touch btn-jump" id="btn-jump">⬆</div>
        </div>
    </div>

    <!-- Question Modal -->
    <div class="modal" id="question-modal">
        <h2 id="modal-title">سؤال العيد الوطني 🇴🇲</h2>
        <div class="question-text" id="modal-question">السؤال هنا؟</div>
        <div class="options-grid" id="modal-options"></div>
        <div id="feedback-msg"></div>
    </div>

    <!-- Win Screen Modal -->
    <div id="win-screen">
        <h1>🎉 أحسنت بطل عُمان! 🎉</h1>
        <p style="font-size:18px; margin: 10px 0;">لقد أكملت مغامرة العيد الوطني العُماني 🇴🇲 بنجاح!</p>
        <div style="background: #e8f5e9; padding: 15px; border-radius: 15px; margin: 15px 0;">
            <p style="font-size: 18px; color:#007a3d;"><strong>🇴🇲 الأعلام المجمعة:</strong> <span id="final-flags">0</span></p>
            <p style="font-size: 18px; color:#d62828;"><strong>❓ الأسئلة المجابة:</strong> 5 / 5</p>
            <p style="font-size: 20px; color:#333; margin-top:5px;"><strong>⭐ المجموع الكلي:</strong> <span id="final-score">0</span> نقطة</p>
        </div>
        <button class="btn-restart" onclick="restartGame()">🔄 العب مرة أخرى</button>
    </div>

    <!-- Fallback image upload for local testing -->
    <div id="file-input-bar">
        <label>تحميل شخصية (813.png): <input type="file" id="char-file" accept="image/*"></label>
        <label>تحميل خلفية (814.webp): <input type="file" id="bg-file" accept="image/*"></label>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Assets Setup
let charImg = new Image();
charImg.src = '813.png';

let bgImg = new Image();
bgImg.src = '814.webp';

// Upload handlers for local testing
document.getElementById('char-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (event) => charImg.src = event.target.result;
        reader.readAsDataURL(file);
    }
});
document.getElementById('bg-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (event) => bgImg.src = event.target.result;
        reader.readAsDataURL(file);
    }
});

// Questions Data
const questions = [
    {
        q: "ما اسم بلدنا العزيز؟",
        options: ["عُمان 🇴🇲", "مصر 🇪🇬"],
        answer: 0
    },
    {
        q: "ما هو اللون الموجود في علم عُمان؟",
        options: ["الأحمر 🔴", "الأصفر 🟡"],
        answer: 0
    },
    {
        q: "ماذا نرفع بفخر في الاحتفالات الوطنية؟",
        options: ["علم عُمان 🇴🇲", "كتاب 📖"],
        answer: 0
    },
    {
        q: "ماذا نشاهد يزين السماء في الاحتفالات؟",
        options: ["الألعاب النارية 🎆", "الثلج ❄️"],
        answer: 0
    },
    {
        q: "ماذا نقول لسلطنة عُمان في عيدها الوطني؟",
        options: ["كل عام وعُمان بخير 🇴🇲", "صباح الخير فقط ☀️"],
        answer: 0
    }
];

// Audio FX (Web Audio API Synthesizer)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'jump') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'collect') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); // E5
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.setValueAtTime(140, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
    } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
    }
}

// Game State
let cameraX = 0;
let score = 0;
let answeredCount = 0;
let isPaused = false;
let gameFinished = false;

// Player Setup
const player = {
    x: 100,
    y: 300,
    width: 60,
    height: 75,
    vx: 0,
    vy: 0,
    speed: 5,
    jumpPower: -13,
    gravity: 0.6,
    grounded: false,
    facingRight: true,
    hidden: false
};

// Platforms Setup
const platforms = [
    { x: 0, y: 420, w: 3200, h: 80 }, // Ground
    { x: 300, y: 320, w: 140, h: 20 },
    { x: 550, y: 260, w: 140, h: 20 },
    { x: 900, y: 310, w: 150, h: 20 },
    { x: 1200, y: 250, w: 160, h: 20 },
    { x: 1550, y: 320, w: 140, h: 20 },
    { x: 1850, y: 270, w: 150, h: 20 },
    { x: 2200, y: 320, w: 160, h: 20 }
];

// Omani Flags Collectibles
let flagsList = [
    { x: 340, y: 270, collected: false },
    { x: 400, y: 370, collected: false },
    { x: 600, y: 210, collected: false },
    { x: 750, y: 370, collected: false },
    { x: 950, y: 260, collected: false },
    { x: 1250, y: 200, collected: false },
    { x: 1400, y: 370, collected: false },
    { x: 1600, y: 270, collected: false },
    { x: 1900, y: 220, collected: false },
    { x: 2250, y: 270, collected: false }
];

// Questions Points
let questionTriggers = [
    { x: 500, qIndex: 0, active: true },
    { x: 1000, qIndex: 1, active: true },
    { x: 1500, qIndex: 2, active: true },
    { x: 2000, qIndex: 3, active: true },
    { x: 2500, qIndex: 4, active: true }
];

// Castle End Goal
const castle = {
    x: 2800,
    y: 180,
    w: 260,
    h: 240,
    doorX: 2900
};

// Fireworks Particle System
let fireworks = [];
function createFirework(x, y) {
    const colors = ['#d62828', '#007a3d', '#ffffff', '#ffb703', '#4cc9f0'];
    const particleCount = 40;
    for (let i = 0; i < particleCount; i++) {
        const angle = (Math.PI * 2 / particleCount) * i;
        const speed = Math.random() * 5 + 2;
        fireworks.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1,
            decay: Math.random() * 0.02 + 0.015,
            radius: Math.random() * 3 + 2
        });
    }
}

function updateFireworks() {
    for (let i = fireworks.length - 1; i >= 0; i--) {
        let p = fireworks[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05; // gravity
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
            fireworks.splice(i, 1);
        }
    }
}

function drawFireworks() {
    fireworks.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x - cameraX, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
}

// Input Handling
const keys = { left: false, right: false, up: false };

window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft') keys.left = true;
    if (e.code === 'ArrowRight') keys.right = true;
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        keys.up = true;
        jump();
    }
});

window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft') keys.left = false;
    if (e.code === 'ArrowRight') keys.right = false;
    if (e.code === 'Space' || e.code === 'ArrowUp') keys.up = false;
});

// Touch Inputs
const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
const btnJump = document.getElementById('btn-jump');

// Correct button orientation setup
btnLeft.style.transform = 'scaleX(-1)'; // Left arrow pointing left

btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
btnRight.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });
btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });

function jump() {
    if (player.grounded && !isPaused && !gameFinished) {
        player.vy = player.jumpPower;
        player.grounded = false;
        playSound('jump');
    }
}

// Question Trigger System
function checkQuestionTriggers() {
    questionTriggers.forEach(q => {
        if (q.active && player.x >= q.x) {
            q.active = false;
            openQuestionModal(q.qIndex);
        }
    });
}

function openQuestionModal(qIndex) {
    isPaused = true;
    const modal = document.getElementById('question-modal');
    const qData = questions[qIndex];
    document.getElementById('modal-question').innerText = qData.q;
    const optionsGrid = document.getElementById('modal-options');
    optionsGrid.innerHTML = '';
    document.getElementById('feedback-msg').innerText = '';

    qData.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(idx, qData.answer);
        optionsGrid.appendChild(btn);
    });

    modal.style.display = 'block';
}

function handleAnswer(selected, correct) {
    const feedback = document.getElementById('feedback-msg');
    if (selected === correct) {
        feedback.style.color = '#007a3d';
        feedback.innerText = '🎉 أحسنت! إجابة صحيحة!';
        playSound('correct');
        score += 5;
        answeredCount++;
        updateHUD();
        setTimeout(() => {
            document.getElementById('question-modal').style.display = 'none';
            isPaused = false;
        }, 1200);
    } else {
        feedback.style.color = '#d62828';
        feedback.innerText = '😊 حاول مرة أخرى!';
        playSound('wrong');
    }
}

function updateHUD() {
    document.getElementById('score-val').innerText = score;
    document.getElementById('quest-val').innerText = `${answeredCount} / 5`;
}

// Game Loop Functions
function update() {
    if (isPaused) return;

    // Horizonal Movement
    if (keys.left) {
        player.vx = -player.speed;
        player.facingRight = false;
    } else if (keys.right) {
        player.vx = player.speed;
        player.facingRight = true;
    } else {
        player.vx = 0;
    }

    // Apply Gravity
    player.vy += player.gravity;

    // Apply Velocity
    player.x += player.vx;
    player.y += player.vy;

    // Prevent moving back past left wall
    if (player.x < 10) player.x = 10;

    // Platform Collisions
    player.grounded = false;
    platforms.forEach(plat => {
        if (player.x < plat.x + plat.w &&
            player.x + player.width > plat.x &&
            player.y + player.height >= plat.y &&
            player.y + player.height <= plat.y + plat.h + player.vy) {
            
            if (player.vy >= 0) {
                player.grounded = true;
                player.vy = 0;
                player.y = plat.y - player.height;
            }
        }
    });

    // Auto recovery if fell below
    if (player.y > canvas.height + 50) {
        player.x = Math.max(100, player.x - 200);
        player.y = 200;
        player.vy = 0;
    }

    // Check Omani Flags Collection
    flagsList.forEach(flag => {
        if (!flag.collected) {
            if (player.x < flag.x + 30 &&
                player.x + player.width > flag.x &&
                player.y < flag.y + 30 &&
                player.y + player.height > flag.y) {
                flag.collected = true;
                score += 1;
                updateHUD();
                playSound('collect');
            }
        }
    });

    // Camera follow player
    cameraX = player.x - canvas.width / 3;
    if (cameraX < 0) cameraX = 0;

    checkQuestionTriggers();

    // Check Mario style Castle End
    if (!gameFinished && player.x >= castle.doorX) {
        triggerWinSequence();
    }

    if (gameFinished) {
        updateFireworks();
        if (Math.random() < 0.1) {
            createFirework(
                castle.x + Math.random() * castle.w,
                castle.y - Math.random() * 100
            );
            playSound('win');
        }
    }
}

function triggerWinSequence() {
    gameFinished = true;
    player.hidden = true; // Enter castle
    playSound('win');

    // Start fireworks explosions around castle
    for (let i = 0; i < 5; i++) {
        setTimeout(() => {
            createFirework(
                castle.x + Math.random() * castle.w,
                castle.y - Math.random() * 120
            );
        }, i * 300);
    }

    setTimeout(() => {
        document.getElementById('final-flags').innerText = score - (answeredCount * 5);
        document.getElementById('final-score').innerText = score;
        document.getElementById('win-screen').style.display = 'block';
    }, 2000);
}

// Drawing Functions
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Draw Background Image (Tiled / Scrolling)
    if (bgImg.complete && bgImg.naturalWidth !== 0) {
        let bgWidth = canvas.height * (bgImg.width / bgImg.height);
        let startTile = Math.floor(cameraX / bgWidth);
        let endTile = Math.floor((cameraX + canvas.width) / bgWidth) + 1;

        for (let i = startTile; i <= endTile; i++) {
            ctx.drawImage(bgImg, i * bgWidth - cameraX, 0, bgWidth, canvas.height);
        }
    } else {
        // Fallback Gradient
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#a1c4fd');
        grad.addColorStop(1, '#c2e9fb');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    ctx.save();
    ctx.translate(-cameraX, 0);

    // 2. Draw Platforms
    platforms.forEach(p => {
        ctx.fillStyle = '#007a3d'; // Omani Green
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#d62828'; // Omani Red Trim
        ctx.fillRect(p.x, p.y, p.w, 5);
    });

    // 3. Draw Collectible Omani Flags 🇴🇲
    flagsList.forEach(f => {
        if (!f.collected) {
            // Draw Omani Flag
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(f.x, f.y, 30, 20);
            ctx.fillStyle = '#d62828';
            ctx.fillRect(f.x, f.y, 10, 20);
            ctx.fillRect(f.x + 10, f.y + 7, 20, 6);
            ctx.fillStyle = '#007a3d';
            ctx.fillRect(f.x + 10, f.y + 13, 20, 7);
            // Flag Pole
            ctx.fillStyle = '#666';
            ctx.fillRect(f.x - 3, f.y, 3, 30);
        }
    });

    // 4. Draw Question Points Flags/Gate
    questionTriggers.forEach(q => {
        if (q.active) {
            ctx.fillStyle = '#ffb703';
            ctx.font = '28px sans-serif';
            ctx.fillText('❓', q.x, 380);
        }
    });

    // 5. Draw Omani Castle at Goal (Nizwa Style Fort)
    drawOmaniCastle(castle.x, castle.y, castle.w, castle.h);

    // 6. Draw Player Character (813.png)
    if (!player.hidden) {
        if (charImg.complete && charImg.naturalWidth !== 0) {
            ctx.save();
            if (!player.facingRight) {
                ctx.translate(player.x + player.width, player.y);
                ctx.scale(-1, 1);
                ctx.drawImage(charImg, 0, 0, player.width, player.height);
            } else {
                ctx.drawImage(charImg, player.x, player.y, player.width, player.height);
            }
            ctx.restore();
        } else {
            // Fallback Character
            ctx.fillStyle = '#d62828';
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }
    }

    // 7. Draw Fireworks Particles
    if (gameFinished) {
        drawFireworks();
    }

    ctx.restore();
}

// Omani Castle Fort Drawing
function drawOmaniCastle(x, y, w, h) {
    // Main Structure
    ctx.fillStyle = '#d4a373';
    ctx.fillRect(x, y, w, h);

    // Battlements
    ctx.fillStyle = '#bc6c25';
    for (let i = 0; i < w; i += 30) {
        ctx.fillRect(x + i, y - 15, 18, 15);
    }

    // Main Towers
    ctx.fillRect(x - 20, y - 30, 45, h + 30);
    ctx.fillRect(x + w - 25, y - 30, 45, h + 30);

    // Tower battlements
    for (let i = -20; i < 25; i += 20) {
        ctx.fillRect(x + i, y - 45, 12, 15);
        ctx.fillRect(x + w - 25 + (i + 20), y - 45, 12, 15);
    }

    // Arched Doorway (Mario Exit)
    ctx.fillStyle = '#2b2d42';
    ctx.beginPath();
    ctx.arc(x + w / 2, y + h - 40, 30, Math.PI, 0, false);
    ctx.rect(x + w / 2 - 30, y + h - 40, 60, 40);
    ctx.fill();

    // Large Omani Flag on Castle Top
    ctx.fillStyle = '#8d99ae';
    ctx.fillRect(x + w / 2 - 2, y - 80, 4, 75);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x + w / 2 + 2, y - 80, 40, 25);
    ctx.fillStyle = '#d62828';
    ctx.fillRect(x + w / 2 + 2, y - 80, 12, 25);
    ctx.fillRect(x + w / 2 + 14, y - 72, 28, 8);
    ctx.fillStyle = '#007a3d';
    ctx.fillRect(x + w / 2 + 14, y - 64, 28, 9);
}

// Main Game Loop
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

function restartGame() {
    player.x = 100;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    player.hidden = false;
    score = 0;
    answeredCount = 0;
    gameFinished = false;
    isPaused = false;
    fireworks = [];

    flagsList.forEach(f => f.collected = false);
    questionTriggers.forEach(q => q.active = true);

    updateHUD();
    document.getElementById('win-screen').style.display = 'none';
    document.getElementById('question-modal').style.display = 'none';
}

// Start Game
loop();
</script>
